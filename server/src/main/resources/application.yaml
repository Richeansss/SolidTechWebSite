spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/pc_db
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: update
    database: mysql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mvc:
    static-path-pattern: /static/**
  web:
    resources:
      static-locations: classpath:/static/,file:images/
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
      enabled: true

